name: Model release gate

on:
  pull_request:
    paths:
      - 'portfolio/model-release-gate/**'
      - '.github/workflows/model-release-gate.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout: portfolio/model-release-gate
      - name: Run release-gate tests
        run: python3 -m unittest discover -s portfolio/model-release-gate -v
      - name: Verify offline promotion demo
        run: python3 portfolio/model-release-gate/demo.py
